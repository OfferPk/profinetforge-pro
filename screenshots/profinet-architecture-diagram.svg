<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="plcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141f33"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#archBg)"/>

  <!-- Title -->
  <text x="600" y="50" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">PROFINET Real-Time Industrial Fieldbus Architecture</text>
  <text x="600" y="75" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">IEC 61158 / IEC 61784 PROFINET IO &amp; IRT Fieldbus with DCP Discovery and IEC 62443 Security</text>

  <!-- Industrial IO-Controller (PLC) Box -->
  <rect x="250" y="110" width="700" height="150" rx="12" fill="url(#plcGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="275" y="140" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">PROFINET IO-CONTROLLER / SIEMENS S7-1500 PLC</text>
  <text x="275" y="162" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Cyclic Real-Time Scheduler (1.0 ms Cycle) | EtherType 0x8892 | Station: simatic-s7-1500</text>

  <g transform="translate(275, 180)">
    <rect x="0" y="0" width="190" height="60" rx="6" fill="#080c14" stroke="#0284c7"/>
    <text x="95" y="25" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Linux nftables Firewall</text>
    <text x="95" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">MAC Pinning &amp; IT/OT Drop</text>

    <rect x="210" y="0" width="220" height="60" rx="6" fill="#080c14" stroke="#0d9488"/>
    <text x="320" y="25" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#2dd4bf" text-anchor="middle">Suricata L7 Fieldbus IDS</text>
    <text x="320" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Rogue DCP Name &amp; STOP Detect</text>

    <rect x="450" y="0" width="190" height="60" rx="6" fill="#080c14" stroke="#a855f7"/>
    <text x="545" y="25" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">PROFINET IO Stack</text>
    <text x="545" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">APDU &amp; PROFIsafe SIL 3</text>
  </g>

  <!-- Industrial Ethernet Backbone Bus Line -->
  <line x1="80" y1="340" x2="1120" y2="340" stroke="#0284c7" stroke-width="6"/>
  <rect x="80" y="325" width="280" height="30" rx="4" fill="#0284c7"/>
  <text x="220" y="345" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PROFINET RT / IRT BACKBONE (100 Mbps Full-Duplex)</text>

  <!-- Vertical Links from Controller to Bus -->
  <line x1="600" y1="260" x2="600" y2="340" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowCyan)"/>

  <!-- Connected IO-Devices -->
  <!-- Device 1: ET200SP Remote IO -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="240" height="250" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="30" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle">IO-DEVICE: ET 200SP</text>
    <text x="120" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Distributed Modular I/O</text>
    <rect x="15" y="65" width="210" height="90" rx="4" fill="#080c14"/>
    <text x="25" y="85" font-family="monospace" font-size="10" fill="#38bdf8">• Station: et200sp-rack1</text>
    <text x="25" y="103" font-family="monospace" font-size="10" fill="#38bdf8">• IP: 192.168.1.20</text>
    <text x="25" y="121" font-family="monospace" font-size="10" fill="#38bdf8">• Frame ID: 0x8000 (Cyclic RT)</text>
    <text x="25" y="139" font-family="monospace" font-size="10" fill="#38bdf8">• IOPS / IOCS: 0x80 (GOOD)</text>
    <text x="120" y="185" font-family="-apple-system, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">Process IO (Temp/Pressure)</text>
    <!-- Tap Line -->
    <line x1="120" y1="0" x2="120" y2="-100" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Device 2: Sinamics S120 Motion Drive -->
  <g transform="translate(350, 440)">
    <rect x="0" y="0" width="240" height="250" rx="8" fill="#1e293b" stroke="#0d9488" stroke-width="1.5"/>
    <text x="120" y="30" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="middle">IO-DEVICE: SINAMICS S120</text>
    <text x="120" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Servo Motion Drive (IRT)</text>
    <rect x="15" y="65" width="210" height="90" rx="4" fill="#080c14"/>
    <text x="25" y="85" font-family="monospace" font-size="10" fill="#2dd4bf">• Station: sinamics-s120</text>
    <text x="25" y="103" font-family="monospace" font-size="10" fill="#2dd4bf">• IP: 192.168.1.30</text>
    <text x="25" y="121" font-family="monospace" font-size="10" fill="#2dd4bf">• Frame ID: 0x0100 (IRT Class 3)</text>
    <text x="25" y="139" font-family="monospace" font-size="10" fill="#2dd4bf">• VLAN: 802.1Q Priority 6</text>
    <text x="120" y="185" font-family="-apple-system, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">Sub-Microsecond Synchronous</text>
    <!-- Tap Line -->
    <line x1="120" y1="0" x2="120" y2="-100" stroke="#2dd4bf" stroke-width="2"/>
  </g>

  <!-- Device 3: Festo Valve Manifold -->
  <g transform="translate(640, 440)">
    <rect x="0" y="0" width="240" height="250" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="30" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle">IO-DEVICE: FESTO CPX</text>
    <text x="120" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Pneumatic Valve Manifold</text>
    <rect x="15" y="65" width="210" height="90" rx="4" fill="#080c14"/>
    <text x="25" y="85" font-family="monospace" font-size="10" fill="#fbbf24">• Station: festo-cpx-terminal</text>
    <text x="25" y="103" font-family="monospace" font-size="10" fill="#fbbf24">• IP: 192.168.1.40</text>
    <text x="25" y="121" font-family="monospace" font-size="10" fill="#fbbf24">• Vendor ID: 0x014D (Festo)</text>
    <text x="25" y="139" font-family="monospace" font-size="10" fill="#fbbf24">• Solenoid Valve Actuators</text>
    <text x="120" y="185" font-family="-apple-system, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">Digital Output Control</text>
    <!-- Tap Line -->
    <line x1="120" y1="0" x2="120" y2="-100" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Device 4: Engineering Station / Wireshark Sniffer -->
  <g transform="translate(930, 440)">
    <rect x="0" y="0" width="220" height="250" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="110" y="30" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#c084fc" text-anchor="middle">ENGINEERING / SNIFFER</text>
    <text x="110" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">ProfinetForge Diagnostic</text>
    <rect x="15" y="65" width="190" height="90" rx="4" fill="#080c14"/>
    <text x="25" y="85" font-family="monospace" font-size="10" fill="#c084fc">• DCP Discovery Scanner</text>
    <text x="25" y="103" font-family="monospace" font-size="10" fill="#c084fc">• Libpcap 2.4 Exporter</text>
    <text x="25" y="121" font-family="monospace" font-size="10" fill="#c084fc">• IEC 62443 Security Audit</text>
    <text x="25" y="139" font-family="monospace" font-size="10" fill="#c084fc">• Zero-Config Web Studio</text>
    <text x="110" y="185" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Passive Tap / Active DCP</text>
    <!-- Tap Line -->
    <line x1="110" y1="0" x2="110" y2="-100" stroke="#c084fc" stroke-width="2"/>
  </g>

  <!-- Footer Specs -->
  <rect x="80" y="725" width="1040" height="40" rx="6" fill="#0b111d" stroke="#1e293b"/>
  <text x="600" y="750" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">PROFINETFORGE PRO: IEC 61158 / IEC 61784 | PROFINET RT / IRT | PROFIsafe SIL 3 | IEC 62443 CYBERSECURITY</text>
</svg>
